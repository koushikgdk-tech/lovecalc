<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BACK TO PORTAL BUTTON -->
<button class="back-btn" onclick="goToPortal()">⬅ Back</button>

<style>
  .back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 10px 18px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    z-index: 9999;
  }
</style>

<script>
  function goToPortal() {
    window.location.href = "https://koushikgdk-tech.github.io/portal/";
  }
</script>

    <div class="container">
        <h1>💖 Love Calculator 💖</h1>

        <div class="form">
            <input type="text" id="name1" placeholder="Enter first name">
            <input type="text" id="name2" placeholder="Enter second name">
            <button onclick="calculateLove()">Calculate Love</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateLove() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();
            const resultDiv = document.getElementById('result');

            if (name1 === "" || name2 === "") {
                resultDiv.innerHTML = "Please enter both names!";
                return;
            }

            // Generate random percentage between 1 and 100
            const lovePercentage = Math.floor(Math.random() * 101);

            resultDiv.innerHTML = `
                💕 ${name1} + ${name2} = <span class="percentage">${lovePercentage}%</span> 💕
            `;
        }
    </script>

</body>

</html>
